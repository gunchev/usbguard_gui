name: Fedora CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora: [ 43, 44 ]
    container:
      image: quay.io/fedora/fedora:${{ matrix.fedora }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tox on Fedora ${{ matrix.fedora }}
        run: |
          dnf -y install uv python3 make gcc fedora-packager \
            python3-devel python3-cairo cairo-gobject-devel cairo-devel libglvnd-glx libglvnd-egl
          # Install every available Python version (older/newer Fedoras have different sets).
          for ver in 3.10 3.11 3.12 3.13 3.14 3.15; do
            dnf -y install "python${ver}" || true
          done
          UV_PYTHON_DOWNLOADS=never QT_QPA_PLATFORM=offscreen uv run tox
