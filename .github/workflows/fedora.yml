name: Fedora CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora: [ 44, 45 ]
    container:
      image: quay.io/fedora/fedora:${{ matrix.fedora }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tox on Fedora ${{ matrix.fedora }}
        run: |
          # dbus-daemon provides the private session bus used by the screen-locker
          # integration tests.
          dnf -y install uv python3 make gcc fedora-packager nodejs dbus-daemon \
            python3-devel python3-cairo cairo-gobject-devel cairo-devel libglvnd-glx libglvnd-egl
          # nodejs is for pyright (the typecheck env in tox.ini): it is a Node tool
          # shipped through pip and would otherwise download its own runtime at run
          # time.  Installing it here keeps the typecheck env offline-deterministic.
          # Install every altver Python in the declared range (tox envlist / pyproject classifiers).
          # The release's DEFAULT python3 is not an altver package: it arrives via python3/python3-devel
          # above. On F44 that default is 3.14, so its `python3.14` iteration fails harmlessly; on
          # F45 the default is 3.15 (outside the envlist, but tox's lint/typecheck envs run under
          # it) and 3.14 is a regular altver this loop installs. Do not "clean up" the || true:
          # altver availability differs per release, and a version missing from one image is covered
          # by the other in the matrix (skip_missing_interpreters = true in tox.ini).
          for ver in 3.10 3.11 3.12 3.13 3.14; do
            dnf -y install "python${ver}" "python${ver}-devel" || true
          done
          UV_PYTHON_DOWNLOADS=never QT_QPA_PLATFORM=offscreen uv run tox
