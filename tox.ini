[tox]
# Keep in sync with the Python versions declared in pyproject.toml classifiers
# (3.10 - 3.14).  Adding a version here means adding the classifier too.
#
# `lint` and `typecheck` lead the envlist because CI runs plain `tox`.  They are
# what makes the documented `make check` gate (lint + typecheck + tests) real in
# CI instead of only on a developer machine; before them CI ran pytest alone, so
# a lint or typing regression could land on master with the checks still green.
# They are separate envs rather than extra commands in [testenv] so the linters
# run once instead of once per interpreter in the matrix.
envlist = lint, typecheck, py310, py311, py312, py313, py314
isolated_build = true
skip_missing_interpreters = true

[testenv]
deps =
    pytest
    pytest-mock
    pytest-cov
    pytest-qt
commands =
    pytest {posargs}

# Mirrors `make lint`.  Nothing here imports the package, so the build is skipped
# entirely and the env stays cheap.
[testenv:lint]
skip_sdist = true
skip_install = true
deps =
    isort
    ruff
    autopep8
commands =
    isort --check-only src/ tests/
    ruff check src/ tests/
    autopep8 --diff --recursive src/ tests/

# Mirrors `make typecheck`.  Unlike lint this one needs the package installed:
# pyright resolves PyQt6 and the rest of the import graph to type-check against it,
# so skip_install is deliberately left at its default.  Needs a Node runtime on the
# host (pyright is a Node tool wrapped for pip) -- CI installs it.
[testenv:typecheck]
skip_sdist = true
deps =
    pyright
    pyqt6-stubs>=20250824
commands =
    pyright src/
