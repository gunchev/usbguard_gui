[tox]
# Keep in sync with the Python versions declared in pyproject.toml classifiers
# (3.10 - 3.14).  Adding a version here means adding the classifier too.
envlist = py310, py311, py312, py313, py314
isolated_build = true
skip_missing_interpreters = true

[testenv]
deps =
    pytest
    pytest-mock
    pytest-cov
    pytest-qt
commands =
    pytest {posargs}
